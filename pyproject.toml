[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logscope"
version = "0.1.0"
description = "Streaming log-analysis CLI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "psutil"]

[project.scripts]
logscope = "logscope.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
